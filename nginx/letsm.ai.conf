# ============================================================
# Letsm AI - Nginx Reverse Proxy
# Domain: letsm.ai (and www.letsm.ai)
# TLS: Let's Encrypt (via certbot service)
# ============================================================

# ---- Rate limiting zones (mitigate brute force / scraping) ----
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

# ---- Upstreams ----
upstream backend_api {
    server backend:8001;
    keepalive 32;
}

upstream frontend_app {
    server frontend:80;
    keepalive 16;
}

# ---- HTTP → HTTPS redirect + ACME challenge ----
server {
    listen 80;
    listen [::]:80;
    server_name letsm.ai www.letsm.ai;

    # ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck for Docker
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS main server ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name letsm.ai www.letsm.ai;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/letsm.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letsm.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # ---- Size limits (Image Analysis / Voice uploads) ----
    client_max_body_size 25M;
    client_body_timeout 60s;

    # ---- Connection cap (per IP) ----
    limit_conn conn_zone 30;

    # ---- API routes → backend (FastAPI) ----
    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Longer timeouts for AI streaming
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 60s;

        # Disable buffering for SSE / streaming
        proxy_buffering off;
        proxy_cache off;
    }

    # ---- Stricter limit for auth endpoints ----
    location ~ ^/api/(auth/login|auth/register|auth/reset) {
        limit_req zone=auth_zone burst=5 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Healthcheck ----
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- Frontend (React SPA) ----
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Block hidden files & common WP attack paths ----
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~ ^/(wp-admin|wp-login|xmlrpc) { deny all; access_log off; }
}
