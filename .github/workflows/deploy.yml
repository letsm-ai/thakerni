# ============================================================
# Letsm AI - GitHub Actions CI/CD
# Trigger: push to `main`
# Strategy: build images on runner -> push to GHCR -> SSH to VPS -> pull & up
# ============================================================
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/letsm

jobs:
  # ─────────────── 1. Build & push images ───────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend ---
      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # --- Frontend ---
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            REACT_APP_BACKEND_URL=${{ secrets.REACT_APP_BACKEND_URL }}
            REACT_APP_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ─────────────── 2. Deploy via VPS self-pull (no SSH from CI) ───────────────
  # We avoid SSH/SCP from GitHub Actions entirely because Hostinger's fail2ban
  # repeatedly bans the dynamic Azure runner IPs, causing i/o timeouts.
  # Instead, a tiny systemd timer on the VPS polls GHCR every 60 seconds and
  # pulls the latest tag automatically.
  # See: /opt/letsm/scripts/auto-deploy.sh (deployed once via server-setup.sh)
  deploy:
    name: Trigger VPS self-deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Tag latest image
        run: |
          echo "✅ Image pushed to GHCR: ${{ needs.build.outputs.image_tag }}"
          echo "📥 VPS auto-deploy timer (runs every 60s) will pull this within 1 minute."
          echo "🔍 Monitor: ssh letsm@<vps> 'tail -f /var/log/letsm-auto-deploy.log'"

      - name: Notify (optional, no-op if unreachable)
        continue-on-error: true
        run: |
          curl -fsS --max-time 5 "https://letsm.ai/api/health" || echo "(letsm.ai not reachable from runner, but VPS will still self-pull)"
