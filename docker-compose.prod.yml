# ============================================================
# Letsm AI - Production Stack
# Stack: Nginx + React + FastAPI + MongoDB + Redis + WhatsApp
# Designed for: Ubuntu 24.04 VPS, 16GB RAM, 4 vCPU
# ============================================================

networks:
  letsm_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local
  wa_auth:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local
  portainer_data:
    driver: local
  netdata_config:
    driver: local
  netdata_lib:
    driver: local
  netdata_cache:
    driver: local

services:
  mongo:
    image: mongo:7
    container_name: letsm_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - letsm_net
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_ROOT_USER}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: letsm_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - letsm_net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: letsm_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${DB_NAME}?authSource=admin"
      DB_NAME: ${DB_NAME}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SENDER_EMAIL: ${SENDER_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL:-https://letsm.ai}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WHATSAPP_SERVICE_URL: "http://whatsapp:3001"
      TZ: ${TZ:-Asia/Muscat}
    networks:
      - letsm_net
    expose:
      - "8001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
        REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: letsm_frontend
    restart: unless-stopped
    networks:
      - letsm_net
    expose:
      - "80"
    
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: letsm_whatsapp
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3001
      BACKEND_URL: "http://backend:8001"
      TZ: ${TZ:-Asia/Muscat}
    volumes:
      - wa_auth:/app/auth_info
    networks:
      - letsm_net
    expose:
      - "3001"

  nginx:
    image: nginx:1.27-alpine
    container_name: letsm_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/letsm.ai.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - letsm_net
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=letsm_letsm_net"
      - "traefik.http.routers.letsm-ai-secure.rule=Host(`letsm.ai`) || Host(`www.letsm.ai`)"
      - "traefik.http.routers.letsm-ai-secure.entrypoints=https"
      - "traefik.http.routers.letsm-ai-secure.tls=true"
      - "traefik.http.routers.letsm-ai-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.letsm-ai-secure.service=letsm-ai-service"
      - "traefik.http.services.letsm-ai-service.loadbalancer.server.port=80"

  uptime:
    image: louislam/uptime-kuma:1
    container_name: letsm_uptime
    restart: unless-stopped
    volumes:
      - ./uptime_data:/app/data
    networks:
      - letsm_net
    ports:
      - "127.0.0.1:3001:3001"   # bind to localhost only; access via SSH tunnel
    deploy:
      resources:
        limits:
          memory: 256M

  # ─────────────── Portainer (Docker management UI) ───────────────
  portainer:
    image: portainer/portainer-ce:latest
    container_name: letsm_portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - letsm_net
    ports:
      - "127.0.0.1:9000:9000"   # SSH tunnel only
    deploy:
      resources:
        limits:
          memory: 256M

  # ─────────────── Dozzle (real-time container logs) ───────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: letsm_dozzle
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_LEVEL: "info"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - letsm_net
    ports:
      - "127.0.0.1:8080:8080"   # SSH tunnel only
    deploy:
      resources:
        limits:
          memory: 64M

  # ─────────────── Netdata (system & container metrics) ───────────────
  netdata:
    image: netdata/netdata:latest
    container_name: letsm_netdata
    restart: unless-stopped
    hostname: letsm.ai
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - letsm_net
    ports:
      - "127.0.0.1:19999:19999"   # SSH tunnel only
    deploy:
      resources:
        limits:
          memory: 256M

  # ─────────────── Mongo Express (DB management UI) ───────────────
  mongo-express:
    image: mongo-express:1-20-alpine3.19
    container_name: letsm_mongo_express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD}
      ME_CONFIG_SITE_BASEURL: "/"
    networks:
      - letsm_net
    ports:
      - "127.0.0.1:8081:8081"   # SSH tunnel only
    deploy:
      resources:
        limits:
          memory: 128M
