# ============================================================
# Letsm AI - Production Stack
# Stack: Nginx + React + FastAPI + MongoDB + Redis + WhatsApp
# Designed for: Ubuntu 24.04 VPS, 16GB RAM, 4 vCPU
# ============================================================
version: "3.9"

networks:
  letsm_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local
  wa_auth:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

services:
  # ─────────────── MongoDB ───────────────
  mongo:
    image: mongo:7
    container_name: letsm_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - letsm_net
    # NOT exposed to host - only internal access
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_ROOT_USER}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  # ─────────────── Redis (cache + rate limiting) ───────────────
  redis:
    image: redis:7-alpine
    container_name: letsm_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - letsm_net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M

  # ─────────────── Backend (FastAPI) ───────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: letsm_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${DB_NAME}?authSource=admin"
      DB_NAME: ${DB_NAME}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SENDER_EMAIL: ${SENDER_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WHATSAPP_SERVICE_URL: "http://whatsapp:3001"
      TZ: ${TZ:-Asia/Muscat}
    networks:
      - letsm_net
    expose:
      - "8001"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
        reservations:
          memory: 512M

  # ─────────────── Frontend (Nginx serving React build) ───────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    container_name: letsm_frontend
    restart: unless-stopped
    networks:
      - letsm_net
    expose:
      - "80"
    deploy:
      resources:
        limits:
          memory: 256M

  # ─────────────── WhatsApp Service (Node.js Baileys) ───────────────
  whatsapp:
    build:
      context: .
      dockerfile: Dockerfile.whatsapp
    container_name: letsm_whatsapp
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3001
      BACKEND_URL: "http://backend:8001"
      TZ: ${TZ:-Asia/Muscat}
    volumes:
      - wa_auth:/app/auth_info
    networks:
      - letsm_net
    expose:
      - "3001"
    deploy:
      resources:
        limits:
          memory: 1G

  # ─────────────── Nginx (Reverse Proxy + TLS terminator) ───────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: letsm_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/letsm.ai.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - letsm_net
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────── Certbot (Let's Encrypt SSL renewal) ───────────────
  certbot:
    image: certbot/certbot:latest
    container_name: letsm_certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

  # ─────────────── Uptime Kuma (Monitoring UI) ───────────────
  uptime:
    image: louislam/uptime-kuma:1
    container_name: letsm_uptime
    restart: unless-stopped
    volumes:
      - ./uptime_data:/app/data
    networks:
      - letsm_net
    ports:
      - "127.0.0.1:3001:3001"   # bind to localhost only; access via SSH tunnel
    deploy:
      resources:
        limits:
          memory: 256M
